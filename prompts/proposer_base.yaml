# Generated by tools/build_prompts.py. Do not hand-edit.
# Sources of truth:
#   - prompts/_prompt_skeleton.yaml
#   - prompts/_op_examples.yaml
#   - step_tl/.../functional.py (_exec_X docstrings)
#   - step_tl/.../ops.py        (class docstrings + __init__ signatures)
general:
  desc: |
    Streaming Tensor Programs (STeP) is a graph-based dataflow IR backed by the
    `step_tl` library, surfaced here as `step.*`. You are writing a single
    function `body(graph, E0, E1, ...)` that builds the compute graph:

      • `graph` is the `step.Graph()` that the harness creates and threads
        through every node.
      • Each `Ei` arg is a **raw `torch.Tensor`** — the underlying for the
        YAML input named `Ei`. The body is responsible for picking a source
        op per input and applying it before any compute ops can consume it.
        The codegen emits a `# Inputs:` comment block immediately above your
        `def body(...)` listing each arg's dtype and PCL-lite dims so you can
        choose the right loader.
      • Compose `step.*` ops; each compute/transform op takes `graph` as its
        first argument and returns a new node consumed by reference.
      • The body MUST end with `return step.OffChipStore(graph, <last_node>,
        par_dispatch=1)`. For multiple outputs return a tuple of stores.

    HARD CONSTRAINT — no torch-to-step bypass. Every reference to an input
    tensor (whether the bare `Ei` arg or `input_data['Ei']`) must appear
    inside the `underlying=` / `tensor=` kwarg expression of a source-op
    call (`LinearOffChipLoad`, `SelectGen`, `RandomOffChipLoad`,
    `DynLinearOffChipLoad`). Tensor-view methods on the input
    (`.reshape`, `.view`, `.permute`, `.unsqueeze`, …) inside that kwarg
    are fine. Passing a raw input tensor to `torch.*` math, the `@`
    matmul operator, indexing, or any helper function is rejected by a
    static gate before pytest — there is no point computing the answer
    in plain torch and wrapping it in a load. After
    `Ei = step.SourceOp(underlying=Ei, ...)` the name `Ei` is a stream
    and may flow into any `step.*` op unrestricted.

    The harness then runs `step.execute(graph, store, input_tensors={})` and
    flat-compares the result (always a 2-D un-tiled tensor) against the
    reference computed from `data_transform`. Only `numel` and element-wise
    values are checked; shapes are not enforced.

    Module-level symbols available in scope:
      - `step` (the step_tl shim)
      - `torch`
      - `input_data` (dict of raw torch tensors, keyed by input name —
        identical to the positional body args, exposed for use inside
        compute-side helpers like map_fn closures)
      - Per-symbol value constants: `M_value, N_value, K_value, D_value` (= 5,
        7, 9, 16) and the sympy Symbols `M, N, K, D` for shape derivation.

    Source-op catalog (pick one per input, driven by the input's declared
    dtype in the `# Inputs:` table):

      - `step.LinearOffChipLoad(underlying=Ei, stride, out_shape_tiled,
        tile_row, tile_col, par_dispatch=1)`
        Tile and stream a fixed-stride tensor. Use for fp32/fp16/uint64
        underlyings. Default tiling `tile_row=1, tile_col=<innermost dim>`
        gives stream shape `(1, *outer_dims, 1)` with tile dtype
        `Tile(1, inner_dim)`. Underlying must be rank>=2; reshape 1-D
        tensors with `Ei.reshape(1, N_value)` first.

      - `step.SelectGen(is_multihot=True, tensor=Ei, n=<E>_value)`
        Load a fp32 underlying of shape `(*outer_dims, E)` as a stream of
        `MultiHot(E)` rows. Use for one-hot routing tensors like
        `expert_onehot` (declared dtype `Multihot(fp32, E)`). Output stream
        shape is `(1,) + tensor.shape[:-1]`. Use `is_multihot=False` for
        `Index(n)` streams instead.

      - `step.RandomOffChipLoad(graph, underlying=Ei, raddr=<addr-stream>,
        tile_row, tile_col, base_addr_byte, par_dispatch=1)`
        Gather-style indirect load driven by an address stream. fp32/fp16
        only (no uint64).

      - `step.DynLinearOffChipLoad(...)` — dynamic-shape tile streams when
        outer dims aren't known at build time.

    Stride convention (LinearOffChipLoad / DynLinearOffChipLoad /
    RandomOffChipLoad): `stride` and `out_shape_tiled` define how tile
    indices map to positions in the underlying tensor's tile grid.
      - Advancing dim: `stride[i] = grid_cols_per_step` — tiles advance
        through the grid along this dim.
      - Broadcast dim: `stride[i] = 0` — same tile replicated along this
        dim (use when a weight/scale must be repeated across tokens).

    Op-call conventions:
      - `write_back_mu=False` for compute and transform ops unless the
        immediate consumer is a `Bufferize` (then `True`).
      - `compute_bw=1024` is a sensible default for arithmetic ops.
      - `par_dispatch=1` on every `OffChipStore`.
function_inventory:
  desc: |
    Map functions — use with UnaryMap / BinaryMap. Tile-in, tile-out, same shape.
      Unary:  Square, Silu, Exp, Pow2, Rsqrt, Sqrt, RowWiseSum,
              MulImmediate(c), AddImmediate(c), SubImmediate(c)
      Binary: Add, Sub, Mul, Div, IsEqual,
              Matmul(weight_transposed=False)       # tile-wise (M,K)x(K,N)

    Accumulation functions — use with Accum to fold trailing stream dims.
      Add, Mul, Max, RetileRow, RetileCol, SignalReqAllRead

    Map+Accum functions — use with BinaryMapAccum for fused matmul-reduce.
      Matmul(weight_transposed=False)

    Init functions — supply the initial state for Accum / BinaryMapAccum.
      Zero(shape, dtype), Empty(shape, dtype), DynEmpty(shape, dtype)
ops:
- name: LinearOffChipLoad
  desc: |
    Source op: tile a torch tensor and stream the resulting tiles in a
    fixed order. The tensor is partitioned into ``(tile_row, tile_col)`` tiles;
    ``out_shape_tiled`` and ``stride`` describe the traversal of those tiles
    (tile index = sum(idx[i] * stride[i])). Output stream shape is
    ``(1,) + out_shape_tiled`` with tile dtype ``Tile(tile_row, tile_col)``;
    set ``transposed=True`` to swap (tile_row, tile_col) on the way out.
    Signature: step.LinearOffChipLoad(underlying, stride, out_shape_tiled, tile_row, tile_col, par_dispatch, mock_bf16=<...>, save_npy=<...>, transposed=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0']
    impl: |
      # E0 is the raw fp32 torch tensor of shape (M_value, N_value). The
      # default tiling `tile_row=1, tile_col=<innermost dim>` gives a stream
      # of shape (1, M_value, 1) with tile dtype Tile(1, N_value) — small
      # tiles that downstream Bufferize/Streamify can reshape on top.
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      return step.OffChipStore(graph, E0, par_dispatch=1)
  - inputs:
    - name: W
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M, K]
      data_transform:
      - |
        input_data['W'].unsqueeze(0).expand(K_value, M_value, N_value)
    impl: |
      # Broadcast-weight pattern: capture the whole (M, N) tensor as one tile
      # (tile_row=M, tile_col=N gives a grid of (1, 1)) and replay it K
      # times along an outer stream dim. `stride=(0,)` is the per-stream-dim
      # advance into the underlying grid; 0 means broadcast — every stream
      # step reads the same grid cell. Used in prefill_transformer_simple to
      # share a Q/K/V projection slice across the token stream.
      W_stream = step.LinearOffChipLoad(
          underlying=W,
          stride=(0,),
          out_shape_tiled=(K_value,),
          tile_row=M_value, tile_col=N_value,
          par_dispatch=1,
      )
      return step.OffChipStore(graph, W_stream, par_dispatch=1)
- name: SelectGen
  desc: |
    Source op for one-hot / multi-hot routing tensors. Turns a fp32
    underlying of shape ``(*outer_dims, n)`` into a stream of either
    ``MultiHot(n)`` (when ``is_multihot=True``) or ``Index(n)`` elements,
    with stream shape ``(1,) + outer_dims``. Use this when the input is a
    select/route signal — e.g. ``expert_onehot`` in routed MoE — rather
    than tile data; ``LinearOffChipLoad`` would tile-mis-shape the inner
    ``n`` dim into the tile rather than treat it as the multihot fan-out.
    The resulting Select-typed stream is consumable by ops whose control
    signature accepts ``Tile | Select`` (e.g. ``FlatPartition``,
    ``Parallelize``, ``StaticReassemble``).
    Signature: step.SelectGen(is_multihot, tensor, n)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    - name: Mhot
      dtype: Multihot(fp32, E)
      dims: [M]
      min: 1
      max: 1
    global: |
      E_value = 2
      ctx[E] = E_value
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0'][input_data['Mhot'][:, 0] > 0]
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # SelectGen turns a fp32 underlying of shape (*outer, E) into a
      # Stream of MultiHot(E) elements with stream shape (1, *outer). Use
      # this for one-hot / multi-hot routing tensors (e.g. expert_onehot
      # in MoE) — LinearOffChipLoad would tile-mis-shape the inner E dim.
      ctrl = step.SelectGen(is_multihot=True, tensor=Mhot, n=E_value)
      # FlatPartition's `control` accepts either Tile or Select streams.
      # Here ctrl is a MultiHot(E) stream that routes each input row to
      # one of E consumer streams. We return consumer-0's slice.
      parts = step.FlatPartition(
          graph,
          input=E0,
          control=ctrl,
          partition_rank=1,
          switch_cycles=[1, 1],
          write_back_mu=False,
          num_consumers=E_value,
      )
      return step.OffChipStore(graph, (parts, 0), par_dispatch=1)
- name: OffChipStore
  desc: |
    Sink op: write a stream of tiles back to off-chip memory. The harness
    uses the captured ``tile_row``/``tile_col`` to un-tile the result at
    ``execute()`` time, returning a tensor whose total numel equals the
    stream's. Every body() in the prompt flow must end with an OffChipStore;
    multi-output bodies return a tuple of stores. Input stream must have
    rank >= 1 (shape len >= 2).
    Signature: step.OffChipStore(graph, input, par_dispatch, store_file_name=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # Every body() ends in OffChipStore. Optionally pass
      # store_file_name=... to control where the simulator writes the
      # un-tiled output (the harness ignores the file name).
      return step.OffChipStore(graph, E0, par_dispatch=1, store_file_name="output")
- name: UnaryMap
  desc: |
    Apply a unary map_fn to every tile of a Tile-stream. Stream shape is
    unchanged; the output tile dtype is determined by the map_fn (most are
    same-shape, e.g. Square/Silu/Exp; RowWiseSum collapses the tile's last
    dim to 1).
    Signature: step.UnaryMap(graph, input, fn, write_back_mu, compute_bw=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0'] ** 2
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      E1 = step.UnaryMap(graph, E0, fn=step.map_fn.Square(), write_back_mu=False, compute_bw=1024)
      return step.OffChipStore(graph, E1, par_dispatch=1)
- name: BinaryMap
  desc: |
    Apply a binary map_fn to every aligned pair of tiles from two
    Tile-streams that share an identical stream shape. Output stream shape
    is unchanged; output tile dtype is determined by the map_fn (Add/Sub/
    Mul/Div/IsEqual keep tile shape; Matmul reduces (M,K)x(K,N) -> (M,N)).
    Signature: step.BinaryMap(graph, in1, in2, fn, write_back_mu, compute_bw=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    - name: E1
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0'] + input_data['E1']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      E1 = step.LinearOffChipLoad(
          underlying=E1,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      E2 = step.BinaryMap(graph, E0, E1, fn=step.map_fn.Add(), write_back_mu=False, compute_bw=1024)
      return step.OffChipStore(graph, E2, par_dispatch=1)
- name: Bufferize and Streamify
  desc: |
    Fold the innermost ``rank`` stream dims of the input into a Buffer
    dtype; stream rank shrinks by ``rank``. No data motion — Bufferize is
    a metadata-only view that lets the consumer (often Streamify) re-emit
    the buffered grid in a different stream order, stride, or shape.

    Unfold a Buffer's grid back into stream dims using ``stride`` and
    ``out_shape_tiled``. Inverse of Bufferize: it re-views previously
    buffered data as a stream without moving data — useful for reshape /
    transpose / re-tile of stream dims.

    Used together they reshape, transpose, or move dimensions of a stream —
    no data motion, just a re-view. The simplest round-trip is
    `Bufferize(rank=1) → Streamify(stride=(1,), out_shape_tiled=(1,))`, an
    identity reshape.

    Signature: step.Bufferize(graph, input, rank, off_chip=<...>)
    Signature: step.Streamify(graph, input, stride, out_shape_tiled, off_chip=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      buf = step.Bufferize(graph, E0, 1)
      out_stream = step.Streamify(graph, buf, stride=(1,), out_shape_tiled=(1,))
      return step.OffChipStore(graph, out_stream, par_dispatch=1)
- name: Accum
  desc: |
    Reduce the trailing ``accum_rank`` stream dims of the input using an
    ``accum_fn`` (Add/Mul/Max for elementwise, RetileRow/RetileCol for
    re-tiling). Output stream shape is ``in.shape[:-accum_rank]``; the
    output tile dtype must be supplied explicitly via ``output_stream_dtype``
    and ``init_fn`` provides the initial accumulator state.
    Signature: step.Accum(graph, input, output_stream_dtype, fn, init_fn, accum_rank, write_back_mu, compute_bw=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, K, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0'].sum(dim=1)
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(K_value, 1, 1),
          out_shape_tiled=(M_value, K_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # E0 stream is (1, M, K, 1) with tile (1, N). accum_rank=2 folds the
      # trailing (K, 1) — the K reduction plus the trivial inner-1.
      E1 = step.Accum(
          graph, E0,
          output_stream_dtype=step.Tile(step.Float32(), (1, N_value)),
          fn=step.accum_fn.Add(),
          init_fn=step.init_fn.Zero(shape=(1, N_value), dtype=step.Float32()),
          accum_rank=2,
          write_back_mu=False,
          compute_bw=1024,
      )
      return step.OffChipStore(graph, E1, par_dispatch=1)
- name: BinaryMapAccum
  desc: |
    Fused binary map + accumulation: per output tile, apply ``fn`` (a
    map_accum_fn, e.g. Matmul) to corresponding tiles of ``in1`` and ``in2``
    and fold the result over the trailing ``rank`` stream dims. The
    canonical use is matmul-reduce: given inputs whose K-axis stream dim
    matches, compute Σ_k tile(in1[k]) @ tile(in2[k]) in one node. Output
    stream shape is ``in.shape[:-rank]``.
    Signature: step.BinaryMapAccum(graph, in1, in2, fn, init_fn, rank, write_back_mu, compute_bw=<...>)
  examples:
  - inputs:
    - name: A
      dtype: fp32
      dims: [K, M]
      data_gen: torch.randn
    - name: B
      dtype: fp32
      dims: [N, K]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['A'] @ input_data['B']
    impl: |
      # Canonical GEMM C = A @ B as a fused matmul-reduce. A is (M, K), B is
      # (K, N), C is (M, N). Both loads use the same (M, N, K) stream-shape;
      # BinaryMapAccum(rank=1) folds the inner K dim. The stride conv is
      # easy to read here:
      #   A grid (M, K): advance M (stride=K), broadcast N (stride=0),
      #     advance K (stride=1).
      #   B grid (K, N): broadcast M (stride=0), advance N (stride=1),
      #     advance K (stride=N — one full grid row).
      A_stream = step.LinearOffChipLoad(
          underlying=A,
          stride=(K_value, 0, 1),
          out_shape_tiled=(M_value, N_value, K_value),
          tile_row=1, tile_col=1,
          par_dispatch=1,
      )
      B_stream = step.LinearOffChipLoad(
          underlying=B,
          stride=(0, 1, N_value),
          out_shape_tiled=(M_value, N_value, K_value),
          tile_row=1, tile_col=1,
          par_dispatch=1,
      )
      C = step.BinaryMapAccum(
          graph, A_stream, B_stream,
          fn=step.map_accum_fn.Matmul(),
          init_fn=step.init_fn.Zero(shape=(1, 1), dtype=step.Float32()),
          rank=1,
          write_back_mu=False,
          compute_bw=1024,
      )
      return step.OffChipStore(graph, C, par_dispatch=1)
- name: Promote
  desc: |
    Insert a singleton stream dim at ``promote_rank`` counted from the
    right (rank 0 = innermost stream dim, just before the tile). Metadata-
    only — no data motion, tile dtype unchanged. Used to align a stream's
    rank with another stream before BinaryMap, or to introduce a dim that
    a later Accum will fold.
    Signature: step.Promote(graph, input, promote_rank)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      E1 = step.Promote(graph, E0, promote_rank=1)
      return step.OffChipStore(graph, E1, par_dispatch=1)
- name: PromoteOuter
  desc: |
    Insert a singleton at the outermost stream dim (rank N from the right,
    where N = input rank). Equivalent to ``Promote(graph, input,
    promote_rank=input.stream.rank)`` but with a fixed-rank-0 semantics.
    Metadata-only — no data motion, tile dtype unchanged.

    Shape: ``[Dn,...,D0] -> [1, Dn,...,D0]``
    Signature: step.PromoteOuter(graph, input)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # PromoteOuter inserts a singleton stream dim at the outermost
      # position (equivalent to Promote(promote_rank=input.stream.rank)).
      # No data motion; useful to align two streams' ranks before BinaryMap.
      E1 = step.PromoteOuter(graph, E0)
      return step.OffChipStore(graph, E1, par_dispatch=1)
- name: RepeatStatic
  desc: |
    Append a new innermost stream dim of size ``repeat_factor``, broadcasting
    every input tile that many times. Stream rank grows by 1; tile dtype and
    data are unchanged. Use when the broadcast factor is a Python int known
    at graph-build time.
    Signature: step.RepeatStatic(graph, input, repeat_factor)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [M, N]
      data_transform:
      - |
        input_data['E0'].unsqueeze(0).expand(N_value, -1)
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0.reshape(1, M_value),
          stride=(1, 1),
          out_shape_tiled=(1, 1),
          tile_row=1, tile_col=M_value,
          par_dispatch=1,
      )
      E1 = step.RepeatStatic(graph, E0, repeat_factor=N_value)
      return step.OffChipStore(graph, E1, par_dispatch=1)
- name: RepeatRef
  desc: |
    Broadcast a stream along a new innermost dim whose size is taken from
    another stream (``ref``). Requires ``input.stream.shape ==
    ref.stream.shape[:-1]``; output stream shape equals ``ref.stream.shape``.
    Tile dtype and per-tile data are unchanged — each input tile is replayed
    once per position in the new dim.
    Signature: step.RepeatRef(graph, input, ref)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [M, K]
      data_gen: torch.randn
    - name: E1
      dtype: fp32
      dims: [M, N, K]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [M, N, K]
      data_transform:
      - |
        input_data['E0'].unsqueeze(1).expand(K_value, N_value, M_value)
    impl: |
      # RepeatRef broadcasts an input stream across the trailing dim of a
      # ref stream. Constraint: input.shape == ref.shape[:-1]. The default
      # loads bring in a trailing-1 stream dim, so Flatten folds that 1 into
      # the next-inner dim before RepeatRef sees the two streams.
      E0_load = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(K_value, 1),
          tile_row=1, tile_col=M_value,
          par_dispatch=1,
      )
      E1_load = step.LinearOffChipLoad(
          underlying=E1,
          stride=(N_value, 1, 1),
          out_shape_tiled=(K_value, N_value, 1),
          tile_row=1, tile_col=M_value,
          par_dispatch=1,
      )
      # Drop the trailing-1: E0 stream (1, K, 1) -> (1, K);
      # E1 stream (1, K, N, 1) -> (1, K, N). Both tiles stay (1, M).
      E0_flat = step.Flatten(graph, E0_load, min_rank=0, max_rank=1)
      E1_flat = step.Flatten(graph, E1_load, min_rank=0, max_rank=1)
      expanded = step.RepeatRef(graph, E0_flat, E1_flat)
      return step.OffChipStore(graph, expanded, par_dispatch=1)
- name: ExpandRef
  desc: |
    Broadcast an input stream's trailing singleton dims to match a ref
    stream's trailing dims. Requires ``input.stream.shape[-expand_rank:]
    == (1,)*expand_rank`` and ``input.stream.shape[:-expand_rank] ==
    ref.stream.shape[:-expand_rank]``; output shape equals
    ``ref.stream.shape``. Like RepeatRef but for multiple trailing dims
    and with the singleton-dim invariant on the input side.
    Signature: step.ExpandRef(graph, input, ref, expand_rank)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    - name: E1
      dtype: fp32
      dims: [N, K, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, K, M]
      data_transform:
      - |
        input_data['E0'].unsqueeze(1).expand(M_value, K_value, N_value)
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      E1 = step.LinearOffChipLoad(
          underlying=E1,
          stride=(K_value, 1, 1),
          out_shape_tiled=(M_value, K_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # ExpandRef broadcasts an input's trailing singleton dims to match
      # a ref stream's trailing dims. Promote E0 first to add the
      # singleton, then expand across the (K, 1) trailing dims of E1.
      E0_p = step.Promote(graph, E0, promote_rank=0)
      expanded = step.ExpandRef(graph, E0_p, E1, expand_rank=2)
      return step.OffChipStore(graph, expanded, par_dispatch=1)
- name: Flatten
  desc: |
    Merge a contiguous range of stream dims into a single dim. Ranks count
    from the right (rank 0 = innermost stream dim); both ``min_rank`` and
    ``max_rank`` endpoints are inclusive. No data motion — only the
    stream-shape metadata changes; tile dtype is unchanged.
    Signature: step.Flatten(graph, input, min_rank, max_rank)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, K, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, K, M]
      data_transform:
      - |
        input_data['E0']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(K_value, 1, 1),
          out_shape_tiled=(M_value, K_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      E1 = step.Flatten(graph, E0, min_rank=1, max_rank=2)
      return step.OffChipStore(graph, E1, par_dispatch=1)
- name: Reshape
  desc: |
    Split one stream dim into two: take the dim at ``reshape_rank``
    (counted from the right) and break it into outer chunks of size
    ``chunk_size``. The split dim's size must be a multiple of chunk_size
    unless a ``pad_fn`` is supplied to pad it up. No data motion.
    Signature: step.Reshape(graph, input, chunk_size, reshape_rank, write_back_mu, add_outer_dim=<...>, pad_fn=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, D]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, D]
      data_transform:
      - |
        input_data['E0']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(D_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      E1 = step.Reshape(graph, E0, chunk_size=8, reshape_rank=1, write_back_mu=False)
      return step.OffChipStore(graph, E1, par_dispatch=1)
- name: ReshapePadStream
  desc: |
    Pad-aware variant of Reshape that also emits a mask stream. Splits
    the dim at ``reshape_rank`` into outer chunks of size ``chunk_size``,
    zero-padding the dim up to the next multiple if needed. Produces two
    output streams: the reshaped data plus a (1, 1)-tile mask stream
    carrying 1.0 for real tiles and 0.0 for padded tiles, so downstream
    ops can mask out the padding.
    Signature: step.ReshapePadStream(graph, input, chunk_size, reshape_rank, write_back_mu, pad_fn=<...>, have_pad_stream=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        torch.nn.functional.pad(input_data['E0'], (0, 0, 0, N_value - M_value), value=0.0)
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # ReshapePadStream splits one stream dim into outer chunks of
      # chunk_size, zero-padding it up to the next multiple if needed.
      # Here M=5 with chunk_size=N=7 → padded to 7 (pad_count=2).
      # have_pad_stream=False makes it a single-output op; set True to
      # also emit a Bool mask stream marking padded tiles.
      reshaped = step.ReshapePadStream(
          graph, E0,
          chunk_size=N_value, reshape_rank=1,
          write_back_mu=False,
          have_pad_stream=False,
      )
      return step.OffChipStore(graph, reshaped, par_dispatch=1)
- name: RetileStreamify
  desc: |
    Split tile dims into multiple smaller tiles and prepend the chunk
    count as a new stream dim. ``split_row=True`` splits ``tile_row`` into
    ``num_chunks`` rows of ``chunk`` each; ``split_row=False`` splits
    ``tile_col`` similarly. Typically used after Accum(RetileRow) /
    Accum(RetileCol) to materialize the merged tile as a stream of
    sub-tiles. ``filter_mask=True`` drops all-zero tiles from the output.
    Signature: step.RetileStreamify(graph, input, split_row, filter_mask=<...>, chunk=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # RetileStreamify splits a tile dim into multiple smaller sub-tiles
      # and prepends the chunk count as a new innermost stream dim.
      # split_row=False splits tile_col; chunk=1 yields N=7 single-element
      # tiles per original tile (stream gains an inner dim of length N).
      retiled = step.RetileStreamify(graph, E0, split_row=False, chunk=1)
      return step.OffChipStore(graph, retiled, par_dispatch=1)
- name: Broadcast
  desc: |
    Fan out one input stream to ``num_consumers`` identical output streams.
    Each consumer sees the same data; stream shape and tile dtype are
    unchanged. The compiler inserts this automatically wherever a single
    stream has more than one downstream reader; user code rarely
    instantiates it explicitly.
    Signature: step.Broadcast(graph, input, num_consumers)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0'] + input_data['E0']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # Explicit Broadcast: fan E0 out to two identical streams accessed
      # via (node, 0) / (node, 1). The compiler inserts Broadcast
      # automatically wherever a stream has multiple readers — this
      # example shows the surface for cases where you want to be explicit.
      bcast = step.Broadcast(graph, E0, num_consumers=2)
      E_sum = step.BinaryMap(
          graph, (bcast, 0), (bcast, 1),
          fn=step.map_fn.Add(),
          write_back_mu=False,
          compute_bw=1024,
      )
      return step.OffChipStore(graph, E_sum, par_dispatch=1)
- name: Parallelize
  desc: |
    Time-multiplex one stream across ``num_consumers`` outputs using
    round-robin scheduling: consumer i receives token i, n+i, 2n+i, ...
    along the outermost stream dim. ``parallelize_rank`` (counted from the
    right) selects which dim gets divided; the chosen dim's size shrinks by
    a factor of ``num_consumers`` per output. Inverse of StaticReassemble.

    Shape: ``[Da,...,D0] x 1 -> [Da//par, ..., D0] x par``
    Signature: step.Parallelize(graph, input, parallelize_rank, num_consumers, switch_cycles=<...>, write_back_mu=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, D]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, D]
      data_transform:
      - |
        input_data['E0']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(D_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # Parallelize + StaticReassemble round-trip = identity. The compiler
      # inserts these to time-multiplex compute across hardware lanes;
      # user code rarely calls them directly. We Flatten the default-load
      # stream (1, D, 1) into (D, 1) so the outermost dim is divisible
      # by num_consumers, then split and re-merge.
      flat = step.Flatten(graph, E0, min_rank=1, max_rank=2)
      par = step.Parallelize(
          graph, flat,
          parallelize_rank=1, num_consumers=2,
      )
      merged = step.StaticReassemble(
          graph, [(par, 0), (par, 1)], merge_rank=1,
      )
      return step.OffChipStore(graph, merged, par_dispatch=1)
- name: StaticReassemble
  desc: |
    Inverse of Parallelize: round-robin-merge ``len(inputs)`` streams of
    identical shape back into one. Output token k*N + i (for N inputs)
    comes from inputs[i] at position k along the merge dim. Only round-
    trips with Parallelize when ``merge_rank == input.stream.rank``
    (entire outermost dim slices are interleaved).

    Shape: ``[Da//par, ..., D0] x par -> [Da,...,D0] x 1``
    Signature: step.StaticReassemble(graph, inputs, merge_rank, switch_cycles=<...>, write_back_mu=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, D]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, D]
      data_transform:
      - |
        input_data['E0']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(D_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # Inverse of Parallelize: round-robin-merge len(inputs) streams
      # back into one. Only round-trips with Parallelize when
      # merge_rank == input.stream.rank (whole outermost-dim slices are
      # interleaved). Same flow as the Parallelize example.
      flat = step.Flatten(graph, E0, min_rank=1, max_rank=2)
      par = step.Parallelize(
          graph, flat,
          parallelize_rank=1, num_consumers=2,
      )
      merged = step.StaticReassemble(
          graph, [(par, 0), (par, 1)], merge_rank=1,
      )
      return step.OffChipStore(graph, merged, par_dispatch=1)
- name: FlatPartition
  desc: |
    Route an input stream's tiles to one of ``num_consumers`` output
    streams using a ``control`` multihot. For each tile t and consumer i,
    if ``control[t, i] > 0`` the tile is appended to consumer i's output.
    Each consumer's outermost dim is a DynDim sized by how many tiles
    route to it. Requires ``input.rank == control.rank + partition_rank``;
    inverse of FlatReassemble. Core building block for MoE expert
    dispatch.
    Signature: step.FlatPartition(graph, input, control, partition_rank, switch_cycles, write_back_mu, num_consumers)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    global: |
      # One-hot routing: first ceil(M/2) tiles → consumer 0, rest → consumer 1.
      Mhot = torch.zeros(M_value, 2)
      Mhot[: (M_value + 1) // 2, 0] = 1.0
      Mhot[(M_value + 1) // 2 :, 1] = 1.0
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0'][Mhot[:, 0] > 0]
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # FlatPartition routes input tiles to one of num_consumers streams
      # based on a multihot control. Each output's outermost dim becomes
      # a DynDim sized by how many tiles route there. The constraint
      # input.rank == ctrl.rank + partition_rank must hold, so we keep
      # input as the default (rank 2) and load ctrl with a custom
      # out_shape_tiled that drops the trailing 1 (rank 1).
      ctrl = step.LinearOffChipLoad(
          underlying=Mhot,
          stride=(1,),
          out_shape_tiled=(M_value,),
          tile_row=1, tile_col=2,
          par_dispatch=1,
      )
      parts = step.FlatPartition(
          graph,
          input=E0,
          control=ctrl,
          partition_rank=1,
          switch_cycles=[1, 1],
          write_back_mu=False,
          num_consumers=2,
      )
      return step.OffChipStore(graph, (parts, 0), par_dispatch=1)
- name: EagerMerge
  desc: |
    Concatenate ``len(inputs)`` streams along the outermost stream dim and
    emit a second "select" multihot stream marking each output tile's
    source input. The outermost dims may be DynDim; the merged dim's size
    is the sum of the inputs'. Inverse of FlatPartition.
    Signature: step.EagerMerge(graph, inputs, input_rank)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    - name: E1
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        torch.cat([input_data['E0'], input_data['E1']], dim=0)
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      E1 = step.LinearOffChipLoad(
          underlying=E1,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # EagerMerge concatenates len(inputs) streams along the outermost
      # stream dim and emits a second "select" multihot stream marking
      # each output tile's source. We Flatten the default-load (1, M, 1)
      # streams down to (M, 1) so the concat dim is the leading dim,
      # then store only the data stream (the select stream has rank 0
      # and can't go to OffChipStore directly).
      flat0 = step.Flatten(graph, E0, min_rank=1, max_rank=2)
      flat1 = step.Flatten(graph, E1, min_rank=1, max_rank=2)
      eager = step.EagerMerge(graph, [flat0, flat1], input_rank=1)
      return step.OffChipStore(graph, (eager, 0), par_dispatch=1)
- name: FlatReassemble
  desc: |
    Merge ``len(inputs)`` streams back into one according to a control
    multihot. For each output position t, gather one tile from every
    input i with ``control[t, i] > 0`` (advancing per-input read pointers).
    Output's outermost dim = control's stream tokens × number of active
    inputs per token. Inverse of FlatPartition; the typical use is
    combining per-expert outputs back into a single sequence after MoE
    routing.
    Signature: step.FlatReassemble(graph, inputs, control, reassemble_rank, switch_cycles, write_back_mu)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    - name: E1
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    global: |
      # All-ones control: every output token gathers one tile from each
      # input, so the per-token group is [E0[t], E1[t]] in order.
      Ctrl = torch.ones(M_value, 2)
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        torch.stack([input_data['E0'], input_data['E1']], dim=1).reshape(M_value, 2 * N_value)
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      E1 = step.LinearOffChipLoad(
          underlying=E1,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # FlatReassemble merges len(inputs) streams back into one according
      # to a control multihot. Inverse of FlatPartition; typical use is
      # combining per-expert outputs back into a single sequence after
      # MoE routing.
      flat0 = step.Flatten(graph, E0, min_rank=1, max_rank=2)
      flat1 = step.Flatten(graph, E1, min_rank=1, max_rank=2)
      ctrl = step.LinearOffChipLoad(
          underlying=Ctrl,
          stride=(1,),
          out_shape_tiled=(M_value,),
          tile_row=1, tile_col=2,
          par_dispatch=1,
      )
      merged = step.FlatReassemble(
          graph,
          inputs=[flat0, flat1],
          control=ctrl,
          reassemble_rank=1,
          switch_cycles=[1, 1],
          write_back_mu=False,
      )
      return step.OffChipStore(graph, merged, par_dispatch=1)
- name: FlatmapFilterRowStreamify
  desc: |
    Drop tile-rows where the per-row mask is 0. Walks every tile in the
    data stream, emits a one-row tile (shape ``(1, tile_col)``) for each
    row whose corresponding mask entry is > 0, and concatenates the
    survivors into a dynamic-length output stream. Used to compact sparse
    or filtered token streams (e.g. drop padded rows).
    Signature: step.FlatmapFilterRowStreamify(graph, input, mask)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    global: |
      # Illustrative-only: the codegen harness loads everything as
      # Tile(Float32), but FlatmapFilterRowStreamify requires a
      # Tile(Bool) mask stream. A real use materializes the mask via
      # a compare op upstream (e.g. BinaryMap(IsEqual)) and feeds the
      # resulting Bool tile-stream in. The body below is the typical
      # shape — wire `mask` to wherever your Bool tile-stream
      # comes from.
      pass
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # Drop tile-rows where the per-row Bool mask is 0. Output's inner
      # stream dim becomes a DynDim sized by how many rows survive.
      # NOTE: this requires `mask` to be a Tile(Bool) stream. The
      # harness's default LinearOffChipLoad only produces Float32 tiles,
      # so wire `mask` in via your own pipeline (e.g. BinaryMap(IsEqual)
      # against a threshold) before calling FlatmapFilterRowStreamify.
      # mask = ...  # Tile(Bool) stream, same outer shape as E0
      # filtered = step.FlatmapFilterRowStreamify(graph, E0, mask)
      # return step.OffChipStore(graph, filtered, par_dispatch=1)
      return step.OffChipStore(graph, E0, par_dispatch=1)
- name: FlatmapCounter
  desc: |
    Expand a scalar tile ``n`` into a stream of ``n`` count-up scalars
    ``0, 1, ..., n-1``. The new count appears as a new innermost stream
    dim of dynamic length. Useful as the address generator for dynamic-
    length ranges (e.g. produce a sequence of indices to feed a gather
    load).
    Signature: step.FlatmapCounter(graph, input)
  examples:
  - inputs: []
    global: |
      # A 1x1 scalar tile holding M_value. FlatmapCounter expands it
      # into a stream of M_value count-up scalars 0..M_value-1.
      n_scalar = torch.tensor([[float(M_value)]])
    outputs:
    - name: S0
      dtype: fp32
      dims: [M]
      data_transform:
      - |
        torch.arange(M_value, dtype=torch.float32)
    impl: |
      # FlatmapCounter expands a scalar tile n into a stream of n
      # count-up scalars (0, 1, ..., n-1) along a new dynamic inner dim.
      # Useful as the address generator for dynamic-length ranges.
      n_loaded = step.LinearOffChipLoad(
          underlying=n_scalar,
          stride=(1,),
          out_shape_tiled=(1,),
          tile_row=1, tile_col=1,
          par_dispatch=1,
      )
      counter = step.FlatmapCounter(graph, n_loaded)
      return step.OffChipStore(graph, counter, par_dispatch=1)
- name: DynLinearOffChipLoad
  desc: |
    Source op variant of LinearOffChipLoad for dynamic-shape inputs. The
    underlying tensor is looked up at execute() time from the
    ``input_tensors`` dict by ``input_tensor_name`` (the load isn't bound
    to a particular tensor at graph-build time). ``tensor_shape_tiled`` may
    contain ``DynDim`` entries that resolve to ints once the run-time
    tensor is in hand. Stream rank == 2 or more (the Rust simulator panics
    on rank-0).
    Signature: step.DynLinearOffChipLoad(input_tensor_name, tensor_shape_tiled, dtype, tile_row, tile_col, par_dispatch, mock_bf16=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # DynLinearOffChipLoad: source op for shapes only known at run
      # time. The underlying tensor is looked up at execute() time from
      # the `input_tensors` dict by `input_tensor_name` (the load isn't
      # bound to a particular tensor at graph-build time). Used when
      # one or more dims of `tensor_shape_tiled` are DynDim. The
      # harness's `input_tensors={}` won't satisfy this op, so a real
      # use needs to thread the tensor through via execute()'s
      # input_tensors kwarg. The example below shows the constructor
      # — fall back to the default E0 load for the actual data path.
      # dyn_in = step.DynLinearOffChipLoad(
      #     input_tensor_name='E0',
      #     tensor_shape_tiled=(M_value, 1),
      #     dtype=torch.float32,
      #     tile_row=1, tile_col=N_value,
      #     par_dispatch=1,
      # )
      return step.OffChipStore(graph, E0, par_dispatch=1)
- name: DynOffChipStore
  desc: |
    Sink op variant of OffChipStore for streams whose untiled shape is
    only known at run time (a stream dim is a DynDim). The output tensor
    shape is read from ``shape_path`` at execute() time; everything else
    matches OffChipStore.
    Signature: step.DynOffChipStore(graph, input, shape_file_name, par_dispatch, store_file_name=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # DynOffChipStore: sink variant of OffChipStore for streams whose
      # un-tiled shape is only known at run time. The output tensor
      # shape is read from `<shape_file_name>.json` at execute() time
      # (the harness ignores the file name). Use this instead of
      # OffChipStore when an upstream op has DynDim-typed stream dims.
      return step.DynOffChipStore(
          graph, E0,
          shape_file_name="dyn_out",
          par_dispatch=1,
      )
- name: DynStreamify
  desc: |
    Dynamic-ref variant of Streamify: replay a Bufferize'd input across
    the stream shape of a ``ref`` stream whose outer dim may be a DynDim.
    The bufferized inner ``bufferized_rank`` dims plus tile dims are
    preserved; the ref's stream shape replaces the input's stream shape
    via broadcast/expand.
    Signature: step.DynStreamify(graph, input, ref, repeat_rank, bufferized_rank=<...>, off_chip=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # DynStreamify: dynamic-ref variant of Streamify. Replays a
      # Bufferize'd input across the stream shape of a `ref` stream
      # whose outer dim may be a DynDim. Constraints:
      #   - input.stream.shape[:-repeat_rank-1] == ref.stream.shape[:-repeat_rank-1]
      #   - input.stream.shape[-repeat_rank-1:] == (1,)*(repeat_rank+1)
      # The ref typically comes from a FlatPartition or other dyn-shape
      # producer. Skeleton:
      #   buf = step.Bufferize(graph, x, rank=<bufferized_rank>)
      #   out = step.DynStreamify(
      #       graph, input=buf, ref=<dyn_ref_stream>,
      #       repeat_rank=<r>, bufferized_rank=<bufferized_rank>,
      #   )
      return step.OffChipStore(graph, E0, par_dispatch=1)
- name: RandomOffChipLoad
  desc: |
    RandomOffChipLoad: index into a tiled tensor using an address stream.

    Mirrors step-perf/memory/random_offchip_load.rs: ``underlying`` may carry
    leading batch dims; tiles are walked in row-major order across all dims
    (batch first, then grid_r, then grid_c) and ``tile_idx`` is a flat global
    index into that list.
    Signature: step.RandomOffChipLoad(graph, underlying, raddr, tile_row, tile_col, base_addr_byte, par_dispatch, mock_bf16=<...>, transposed=<...>)
  examples:
  - inputs: []
    global: |
      # Synthetic underlying weight table + address stream. The address
      # stream is built from a 1-D tensor of integer indices via a
      # default LinearOffChipLoad, then RandomOffChipLoad gathers one
      # tile from W per address.
      W_table = torch.randn(M_value, N_value)
      addr_t = torch.arange(M_value, dtype=torch.float32).reshape(M_value, 1)
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        W_table
    impl: |
      # RandomOffChipLoad: indirect-access gather. The address stream's
      # scalar tiles are flat tile indices into `underlying`; each
      # address triggers a tile-sized load and the result inherits the
      # address stream's outer shape.
      addr = step.LinearOffChipLoad(
          underlying=addr_t,
          stride=(1,),
          out_shape_tiled=(M_value,),
          tile_row=1, tile_col=1,
          par_dispatch=1,
      )
      gathered = step.RandomOffChipLoad(
          graph,
          underlying=W_table,
          raddr=addr,
          tile_row=1, tile_col=N_value,
          base_addr_byte=0,
          par_dispatch=1,
      )
      return step.OffChipStore(graph, gathered, par_dispatch=1)
- name: RandomOffChipStore
  desc: |
    Scatter-store: write `wdata` tiles into ``underlying`` at the per-tile
    addresses produced by `waddr`. Two input streams must have aligned
    stream shape (one tile of data per address). Used for indirect
    writes; the Linear/OffChipStore counterpart writes to consecutive
    positions in stride order.
    Signature: step.RandomOffChipStore(graph, underlying, wdata, waddr, tile_row, tile_col, base_addr_byte, par_dispatch, ack_based_on_waddr=<...>, buffer_depth=<...>, mock_bf16=<...>, has_done_stream=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    global: |
      # Underlying scratchpad the scatter writes into; the address
      # stream supplies one tile-index per data tile.
      W_scratch = torch.zeros(M_value, N_value)
      addr_t = torch.arange(M_value, dtype=torch.float32).reshape(M_value, 1)
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        input_data['E0']
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # RandomOffChipStore: indirect-access scatter. Writes wdata tiles
      # into `underlying` at the per-tile addresses produced by waddr.
      # The Bool ack stream it returns is normally consumed downstream
      # (ConsumerContext or similar). For the self-contained example
      # we wire RandomOffChipStore as a side-effect node and keep
      # OffChipStore(E0) as the harness's test sink.
      addr = step.LinearOffChipLoad(
          underlying=addr_t,
          stride=(1,),
          out_shape_tiled=(M_value,),
          tile_row=1, tile_col=1,
          par_dispatch=1,
      )
      flat = step.Flatten(graph, E0, min_rank=1, max_rank=2)
      step.RandomOffChipStore(
          graph,
          underlying=W_scratch,
          wdata=flat,
          waddr=addr,
          tile_row=1, tile_col=N_value,
          base_addr_byte=0,
          par_dispatch=1,
      )
      return step.OffChipStore(graph, E0, par_dispatch=1)
- name: LinearOffChipLoadRef
  desc: |
    LinearOffChipLoadRef: load weight tiles, broadcast over ref dims.
    Signature: step.LinearOffChipLoadRef(graph, ref, underlying, stride, out_shape_tiled, tile_row, tile_col, par_dispatch, mock_bf16=<...>, transposed=<...>, trigger_rank=<...>)
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    global: |
      W = torch.randn(K_value, K_value)
    outputs:
    - name: S0
      dtype: fp32
      dims: [K, K, M]
      data_transform:
      - |
        W.unsqueeze(0).expand(M_value, K_value, K_value)
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      # LinearOffChipLoadRef loads weight tiles and broadcasts them over
      # the ref stream's outer dims. Useful for sharing fixed weights
      # across a batch of activations without materializing the broadcast.
      W_bcast = step.LinearOffChipLoadRef(
          graph,
          ref=E0,
          underlying=W,
          stride=(1, 1),
          out_shape_tiled=(1, 1),
          tile_row=K_value, tile_col=K_value,
          par_dispatch=1,
          trigger_rank=0,
      )
      return step.OffChipStore(graph, W_bcast, par_dispatch=1)
- name: MockStreamOp
  desc: |
    Test/debug source that produces an all-zeros tensor of the declared
    stream shape (and tile dtype). Has no input edges and no off-chip
    backing tensor — handy as a placeholder in graphs whose timing/shape
    behavior you want to exercise without real data.
    Signature: step.MockStreamOp(stream, aten_op_name=<...>, output_idx=<...>)
  examples:
  - inputs: []
    outputs:
    - name: S0
      dtype: fp32
      dims: [N, M]
      data_transform:
      - |
        torch.zeros(M_value, N_value)
    impl: |
      # Source op that emits an all-zeros tensor of the declared stream
      # shape and tile dtype. Has no input edges and no off-chip backing
      # tensor — useful as a placeholder in graphs whose timing or
      # shape behavior you want to exercise without real data.
      mock = step.MockStreamOp(
          stream=step.Stream(
              stream_dtype=step.Tile(tile_dtype=step.Float32(), shape=(1, N_value)),
              shape=(1, M_value, 1),
          ),
      )
      return step.OffChipStore(graph, mock, par_dispatch=1)
patterns:
- name: Inner-dim row-wise reduction
  desc: |
    When the dim you want to reduce is already the innermost dim, it lives
    inside the tile (since default `tile_col=<inner>`). Use UnaryMap with
    map_fn.RowWiseSum() to sum across the tile's last dim — no Accum
    required, no shape gymnastics. Output tiles become (1, 1).
  examples:
  - inputs:
    - name: E0
      dtype: fp32
      dims: [N, M]
      data_gen: torch.randn
    outputs:
    - name: S0
      dtype: fp32
      dims: [M]
      data_transform:
      - |
        input_data['E0'].sum(dim=-1)
    impl: |
      E0 = step.LinearOffChipLoad(
          underlying=E0,
          stride=(1, 1),
          out_shape_tiled=(M_value, 1),
          tile_row=1, tile_col=N_value,
          par_dispatch=1,
      )
      E1 = step.UnaryMap(graph, E0, fn=step.map_fn.RowWiseSum(), write_back_mu=False, compute_bw=1024)
      return step.OffChipStore(graph, E1, par_dispatch=1)
